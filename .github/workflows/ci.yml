name: CI

on:
  push:
  pull_request:

# Le job ne fait que lire le code et lancer les tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run backend tests
        run: CI=true docker compose -f docker-compose.test.yml up --build --force-recreate --abort-on-container-exit --exit-code-from test-backend
