name: CI

on:
  push:
  pull_request:

# Le job ne fait que lire le code et lancer les tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run backend tests
        run: CI=true docker compose -f docker-compose.test.yml up --build --force-recreate --abort-on-container-exit --exit-code-from test-backend

      # Tableau des résultats dans l'onglet « Summary » du run (aussi quand les tests échouent).
      # Le statut du job reste porté par l'étape précédente.
      - name: Test summary
        if: ${{ !cancelled() }}
        run: node .github/scripts/vitest-summary.mjs back/test-results/vitest.json >> "$GITHUB_STEP_SUMMARY"
