server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # mime.types de nginx:alpine ne mappe pas .mjs (servi en octet-stream) :
    # le navigateur refuse alors d'importer le worker pdf.js comme module ES.
    # `types` remplace la table MIME entière, d'où le bloc dédié.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
