services:
  sql-db:
    image: mysql:8.4.8
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD}
    volumes:
      - ./database/mysql/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/mysql/mysql-data:/var/lib/mysql
    networks:
      - backend-net
    ports:
      - 5001:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
  nosql-db:
    image: mongo:latest
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD}
    volumes:
      - ./database/mongodb/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - ./database/mongodb/mongo-data:/data/db
    ports:
      - ${MONGO_PORT:-4011}:27017
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  backend:
    build:
      context: ./back/
      dockerfile: Dockerfile
    depends_on:
      sql-db:
        condition: service_healthy
        restart: true
      nosql-db:
        condition: service_healthy
        restart: true
    develop:
      watch:
        - action: sync
          path: ./back/src
          target: /app/src
          initial_sync: true
        - action: rebuild
          path: ./back/package.json
          initial_sync: true
        - action: sync+restart
          path: ./back/.env.back
          target: /app/src
    env_file:
      - ./.env
      - ./back/.env.back
    networks:
      - backend-net
      - frontend-net
    ports:
      - "4000:4000"
  frontend:
    build:
      context: ./front/disciplina-front
      dockerfile: Dockerfile
    develop:
      watch:
        - path: ./front/disciplina-front/src
          action: sync
          target: /app/src
          initial_sync: true
        - path: ./front/disciplina-front/package.json
          action: rebuild
    depends_on:
      backend:
        condition: service_started
        restart: true
    networks:
      - frontend-net
    ports:
      - "5173:5173"
networks:
  frontend-net:
  backend-net: