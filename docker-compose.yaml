services:
  sql-db:
    image: mysql:8.4.8
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD}
    volumes:
      - ./database/mysql/mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/mysql/mysql-seed-dev.sql:/docker-entrypoint-initdb.d/99-seed-dev.sql
      - ./database/mysql/mysql-seed-e2e.sql:/docker-entrypoint-initdb.d/98-seed-e2e.sql
      - ./database/mysql/mysql-data:/var/lib/mysql
    networks:
      - backend-net
    ports:
      - ${MYSQL_PORT:-4010}:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
  nosql-db:
    image: mongo:8.2.6
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD}
    volumes:
      - ./database/mongodb/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - ./database/mongodb/mongo-data:/data/db
    ports:
      - ${MONGO_PORT:-4011}:27017
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  ollama:
    image: ollama/ollama:latest
    restart: always
    volumes:
      - ./ollama-data:/root/.ollama
    networks:
      - backend-net
    # Ollama n'a aucune authentification : le port reste sur la boucle locale.
    # Le backend l'atteint par backend-net (OLLAMA_BASE_URL=http://ollama:11434).
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "sh", "-c", "ollama list | grep -q qwen2.5"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull qwen2.5:3b && wait"]
  backend:
    build:
      context: ./back/
      dockerfile: Dockerfile
      target: dev
    depends_on:
      sql-db:
        condition: service_healthy
        restart: true
      nosql-db:
        condition: service_healthy
        restart: true
      otel-collector:
        condition: service_started
      # ollama:
        # condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./back/src
          target: /app/src
          # initial_sync: true
        - action: rebuild
          path: ./back/package.json
          # initial_sync: true
        - action: sync+restart
          path: ./back/.env.back
          target: /app/src
    env_file:
      - ./.env
      - ./back/.env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - E2E_DISABLE_LOGIN_RATE_LIMIT=${E2E_DISABLE_LOGIN_RATE_LIMIT:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=disciplina-api
      - OTEL_TRACES_SAMPLER=always_on
    networks:
      - backend-net
      - frontend-net
    ports:
      - "4000:4000"
  startup-script:
    build:
      context: ./scripts
      dockerfile: Dockerfile
    depends_on:
      sql-db:
        condition: service_healthy
      nosql-db:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      MYSQL_USER: root
      MYSQL_DATABASE: disciplina
      # Inside the compose network the databases answer on their service name and
      # their container port. MYSQL_PORT/MONGO_PORT are the host-side published
      # ports (left of the `ports:` mapping) and do not resolve here, so both are
      # pinned to the container ports below. The LOCAL_MYSQL_* defaults
      # (localhost:5001) stay right for the scripts run from the host.
      LOCAL_MYSQL_HOST: sql-db
      LOCAL_MYSQL_PORT: 3306
      MONGO_HOST: nosql-db
      MONGO_PORT: 27017
      NODE_ENV: ${NODE_ENV:-development}
    restart: no
    networks:
      - backend-net
  frontend:
    build:
      context: ./front/disciplina-front
      dockerfile: Dockerfile
      target: dev
    environment:
      - VITE_API_URL=http://localhost:4000
    develop:
      watch:
        - path: ./front/disciplina-front/src
          action: sync
          target: /app/src
          # initial_sync: true
        - path: ./front/disciplina-front/package.json
          action: rebuild
    depends_on:
      backend:
        condition: service_started
        restart: true
    networks:
      - frontend-net
    ports:
      - "5173:5173"
  dozzle:
    image: amir20/dozzle:latest
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle-data:/data
    environment:
      - DOZZLE_AUTH_PROVIDER=simple
    networks:
      - backend-net
      - frontend-net
    ports:
      - "9999:8080"
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config", "/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml
    networks:
      - backend-net
    ports:
      - "4318:4318"

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - backend-net
    ports:
      - "16686:16686"
      - "4317:4317"

networks:
  frontend-net:
  backend-net:
