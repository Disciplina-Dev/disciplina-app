services:
  sql-db:
    image: mysql:8.4.8
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD}
    volumes:
      - ./database/mysql/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/mysql/mysql-data:/var/lib/mysql
    networks:
      - backend-net
    ports:
      - ${MYSQL_PORT:-4010}:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
  nosql-db:
    image: mongo:latest
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD}
    volumes:
      - ./database/mongodb/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - ./database/mongodb/mongo-data:/data/db
    ports:
      - ${MONGO_PORT:-4011}:27017
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  ollama:
    image: ollama/ollama:latest
    restart: always
    volumes:
      - ./ollama-data:/root/.ollama
    networks:
      - backend-net
    # Ollama n'a aucune authentification : le port reste sur la boucle locale.
    # Le backend l'atteint par backend-net (OLLAMA_BASE_URL=http://ollama:11434).
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "sh", "-c", "ollama list | grep -q qwen2.5"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull qwen2.5:3b && wait"]
  backend:
    build:
      context: ./back/
      dockerfile: Dockerfile
    depends_on:
      sql-db:
        condition: service_healthy
        restart: true
      nosql-db:
        condition: service_healthy
        restart: true
      # ollama:
        # condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./back/src
          target: /app/src
          # initial_sync: true
        - action: rebuild
          path: ./back/package.json
          # initial_sync: true
        - action: sync+restart
          path: ./back/.env.back
          target: /app/src
    env_file:
      - ./.env
      - ./back/.env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    networks:
      - backend-net
      - frontend-net
    ports:
      - "4000:4000"
  startup-script:
    build:
      context: ./scripts
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      MYSQL_USER: root
      MYSQL_DATABASE: disciplina
      MONGO_HOST: nosql-db
      NODE_ENV: ${NODE_ENV:-development}
    restart: no
    networks:
      - backend-net
  frontend:
    build:
      context: ./front/disciplina-front
      dockerfile: Dockerfile
    environment:
      - VITE_API_URL=http://localhost:4000
    develop:
      watch:
        - path: ./front/disciplina-front/src
          action: sync
          target: /app/src
          # initial_sync: true
        - path: ./front/disciplina-front/package.json
          action: rebuild
    depends_on:
      backend:
        condition: service_started
        restart: true
    networks:
      - frontend-net
    ports:
      - "5173:5173"
networks:
  frontend-net:
  backend-net:
