version: '3.9'

services:
  sql-db:
    image: mysql:8.4.8
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./database/mysql/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/mysql/mysql-data:/var/lib/mysql
    networks:
      - back-end
    ports:
      - 5001:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
  nosql-db:
    image: mongo:latest
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - ./database/mongodb/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - ./database/mongodb/mongo-data:/data/db
    ports:
      - ${MONGO_PORT}:27017
    networks:
      - back-end
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  backend:
    build:
      context: ./back/
      dockerfile: Dockerfile
    depends_on:
      sql-db:
        condition: service_healthy
      nosql-db:
        condition: service_healthy
    env_file:
      - ./.env
      - ./back/.env
    networks:
      - back-end
      - front-end
    ports:
      - "4000:4000"
  frontend:
    build:
      context: ./front/disciplina-front
      dockerfile: Dockerfile
    depends_on:
      - backend
    networks:
      - front-end
    ports:
      - "5173:5173"
networks:
  front-end:
  back-end: